<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<title>Number Mosaic Generator — Beta 1</title>
<style>
  :root{
    color-scheme: light only;
    --paper:#F7F5F0;
    --card:#FFFFFF;
    --ink:#1F1D2B;
    --ink-soft:#6B6779;
    --line:#E2DED4;
    --line-strong:#CFC9BC;
    --brand:#5B4BD6;
    --brand-soft:#EFEDFC;
    --go:#159A6B;
    --radius:18px;
    --tap:48px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ background:var(--paper); -webkit-text-size-adjust:100%; }
  body{
    margin:0; min-height:100vh;
    background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
    font-size:16px; line-height:1.45;
    padding:16px 14px calc(28px + env(safe-area-inset-bottom));
  }
  .masthead{
    background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px 16px;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap;
  }
  .masthead h1{ font-size:1.15rem; line-height:1.25; margin:0; font-weight:800; letter-spacing:-0.01em; }
  .badge{
    display:inline-block; margin-top:4px; font-size:.72rem; font-weight:700;
    color:var(--brand); background:var(--brand-soft); border-radius:999px; padding:2px 10px;
  }
  select#langSelect{
    font-family:inherit; font-size:.95rem; font-weight:600; color:var(--ink);
    background:var(--card); min-height:var(--tap); padding:0 14px;
    border-radius:12px; border:1.5px solid var(--line-strong);
    -webkit-appearance:none; appearance:none;
  }
  .card{
    background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); padding:16px; margin-top:14px;
  }
  .card-head{ display:flex; align-items:center; gap:10px; margin:0 0 14px 0; }
  .step{
    flex:none; width:26px; height:26px; border-radius:50%;
    background:var(--ink); color:#fff; font-size:.78rem; font-weight:800;
    display:flex; align-items:center; justify-content:center;
  }
  .card-head h2{ font-size:.95rem; margin:0; font-weight:800; }

  .cat-block{ margin-bottom:16px; }
  .cat-block:last-child{ margin-bottom:0; }
  .cat-title{
    font-size:.78rem; font-weight:800; letter-spacing:.04em;
    text-transform:uppercase; color:var(--ink-soft); margin:0 0 8px 0;
  }
  .shape-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(72px,1fr)); gap:8px; }
  .shape-btn{
    border:2px solid var(--line); background:var(--card); border-radius:14px;
    padding:5px 5px 6px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    transition:border-color .12s, background .12s;
  }
  .shape-btn canvas{ width:100%; aspect-ratio:1/1; border-radius:10px; display:block; }
  .shape-btn span{ font-size:.7rem; font-weight:600; color:var(--ink-soft); line-height:1.2; text-align:center; }
  .shape-btn.active{ border-color:var(--brand); background:var(--brand-soft); }
  .shape-btn.active span{ color:var(--brand); font-weight:800; }

  .seg{ display:grid; gap:8px; }
  .seg-3{ grid-template-columns:repeat(3,1fr); }
  .seg-2{ grid-template-columns:repeat(2,1fr); }
  .seg-btn{
    min-height:var(--tap); display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:1px;
    border:2px solid var(--line); background:var(--card); border-radius:14px;
    cursor:pointer; font-size:.88rem; font-weight:700; color:var(--ink); padding:8px 6px;
    text-align:center;
  }
  .seg-btn small{ font-size:.66rem; font-weight:600; color:var(--ink-soft); line-height:1.25; }
  .seg-btn.active{ border-color:var(--brand); background:var(--brand-soft); color:var(--brand); }
  .seg-btn.active small{ color:var(--brand); }

  .btn{
    width:100%; min-height:var(--tap); font-family:inherit; font-size:.98rem;
    font-weight:800; border:none; border-radius:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px; padding:12px 16px;
  }
  .btn-go{ background:var(--go); color:#fff; }
  .btn-primary{ background:var(--brand); color:#fff; }
  .btn-dark{ background:var(--ink); color:#fff; }
  .btn:active{ transform:translateY(1px); }
  .btn[disabled]{ background:#EDEAE3; color:#A9A395; cursor:default; transform:none; }
  .btn-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }

  .preview-wrap{ display:flex; flex-direction:column; align-items:center; gap:12px; }
  #puzzleCanvas{
    width:100%; max-width:540px; border-radius:12px;
    border:1px solid var(--line-strong); background:#fff; display:block;
  }
  .empty{
    width:100%; border:2px dashed var(--line-strong); border-radius:14px;
    padding:32px 18px; text-align:center; color:var(--ink-soft);
    font-size:.9rem; background:#FCFBF8;
  }
  .legend{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .legend-item{
    display:flex; align-items:center; gap:7px; font-size:.85rem; font-weight:700;
    color:var(--ink); background:#FAF9F6; border:1px solid var(--line-strong);
    border-radius:999px; padding:5px 12px;
  }
  .swatch{ width:20px; height:20px; border-radius:6px; flex:none; border:1.5px solid rgba(31,29,43,.35); }
  .hint{ font-size:.78rem; color:var(--ink-soft); margin:10px 0 0; text-align:center; line-height:1.5; }

  #printArea{ display:none; }

  @media print{
    html,body{ background:#fff; }
    body > *:not(#printArea){ display:none !important; }
    #printArea{ display:block; margin:0; padding:0; }
    .print-page{ page-break-after:always; break-after:page; text-align:center; padding:0; }
    .print-page:last-child{ page-break-after:auto; break-after:auto; }
    .print-title{ font-size:15pt; font-weight:800; margin:0 0 5mm; }
    .print-page img{ display:block; margin:0 auto; max-width:170mm; max-height:200mm; }
    .print-legend{ display:flex; flex-wrap:wrap; gap:5px; justify-content:center; margin-top:5mm; }
    .print-legend .legend-item{ font-size:9pt; padding:3px 8px; background:#fff; }
    .print-legend .swatch{
      width:14px; height:14px;
      -webkit-print-color-adjust:exact; print-color-adjust:exact;
    }
  }
  @page{ size:A4 portrait; margin:12mm; }
</style>
</head>
<body>

<header class="masthead">
  <div>
    <h1 id="appTitle">Number Mosaic Generator</h1>
    <span class="badge" id="appSub">Beta 1</span>
  </div>
  <select id="langSelect" aria-label="Language">
    <option value="en">English</option>
    <option value="ar">العربية</option>
    <option value="he">עברית</option>
    <option value="de">Deutsch</option>
  </select>
</header>

<section class="card">
  <div class="card-head"><div class="step">1</div><h2 id="lblChoose">Choose a picture</h2></div>
  <div id="shapePicker"></div>
</section>

<section class="card">
  <div class="card-head"><div class="step">2</div><h2 id="lblFrame">Puzzle outline</h2></div>
  <div class="seg seg-2" id="frameRow"></div>
</section>

<section class="card">
  <div class="card-head"><div class="step">3</div><h2 id="lblDiff">Difficulty</h2></div>
  <div class="seg seg-3" id="diffRow"></div>
</section>

<section class="card">
  <div class="card-head"><div class="step">4</div><h2 id="lblGenerate">Generate</h2></div>
  <button class="btn btn-go" id="btnGenerate"></button>
  <p class="hint" id="genHint"></p>
</section>

<section class="card">
  <div class="card-head"><div class="step">5</div><h2 id="lblPreview">Preview</h2></div>
  <div class="preview-wrap">
    <div class="empty" id="emptyState"></div>
    <canvas id="puzzleCanvas" width="960" height="960" style="display:none"></canvas>
    <div class="legend" id="legendBox"></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="btnPng" disabled></button>
    <button class="btn btn-dark" id="btnPrint" disabled></button>
  </div>
  <p class="hint" id="printNote"></p>
</section>

<div id="printArea">
  <div class="print-page">
    <div class="print-title" id="pTitle1"></div>
    <img id="pImgPuzzle" alt="">
    <div class="print-legend" id="pLegend"></div>
  </div>
  <div class="print-page">
    <div class="print-title" id="pTitle2"></div>
    <img id="pImgAnswer" alt="">
  </div>
</div>

/* =====================================================================
   2. DRAWING PRIMITIVES  (design space is always 960 x 960)
   ===================================================================== */
var DESIGN = 960;

function ellipseC(ctx,cx,cy,rx,ry,fill){
  ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
  ctx.fillStyle=fill; ctx.fill();
}
function circleC(ctx,cx,cy,r,fill){ ellipseC(ctx,cx,cy,r,r,fill); }
function polyC(ctx,pts,fill){
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(var i=1;i<pts.length;i++){ ctx.lineTo(pts[i][0],pts[i][1]); }
  ctx.closePath(); ctx.fillStyle=fill; ctx.fill();
}
function rrectC(ctx,x0,y0,x1,y1,r,fill){
  var w=x1-x0,h=y1-y0; r=Math.min(r,w/2,h/2);
  ctx.beginPath(); ctx.moveTo(x0+r,y0);
  ctx.lineTo(x1-r,y0); ctx.arcTo(x1,y0,x1,y0+r,r);
  ctx.lineTo(x1,y1-r); ctx.arcTo(x1,y1,x1-r,y1,r);
  ctx.lineTo(x0+r,y1); ctx.arcTo(x0,y1,x0,y1-r,r);
  ctx.lineTo(x0,y0+r); ctx.arcTo(x0,y0,x0+r,y0,r);
  ctx.closePath(); ctx.fillStyle=fill; ctx.fill();
}
function lineC(ctx,x1,y1,x2,y2,color,width){
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
  ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineCap="round"; ctx.stroke();
}
/* regular polygon, radius r, first vertex at angle rot */
function regPoly(ctx,cx,cy,r,sides,rot,fill){
  var pts=[],i,a;
  for(i=0;i<sides;i++){
    a = rot + i*2*Math.PI/sides;
    pts.push([cx+r*Math.cos(a), cy+r*Math.sin(a)]);
  }
  polyC(ctx,pts,fill);
}
/* concentric bands: draws largest→smallest so each colour forms a ring */
function bands(ctx,colors,drawAt){
  var i, n=colors.length;
  for(i=0;i<n;i++){ drawAt(1 - i/n, colors[i]); }
}

var CATEGORY_ORDER = ["geometry","animals","cars","plants","clouds"];
var FRAMES = ["shape","square"];

  { id:"easy",   cols:16 },
  { id:"medium", cols:24 },
  { id:"hard",   cols:32 }
];

/* =====================================================================
   4. AUTO-FIT — measure the subject, scale it to fill the frame
   ===================================================================== */
var FILL_RATIO = 0.94;
var fitCache = {};

function fgCanvasOf(shape){
  var c = document.createElement("canvas");
  c.width=DESIGN; c.height=DESIGN;
  shape.draw(c.getContext("2d"));
  return c;
}

function computeFit(shape){
  if(fitCache[shape.id]){ return fitCache[shape.id]; }
  var ctx = fgCanvasOf(shape).getContext("2d");
  var data = ctx.getImageData(0,0,DESIGN,DESIGN).data;
  var minX=DESIGN,minY=DESIGN,maxX=-1,maxY=-1,x,y;
  for(y=0;y<DESIGN;y++){
    for(x=0;x<DESIGN;x++){
      if(data[(y*DESIGN+x)*4+3]>12){
        if(x<minX){minX=x;} if(x>maxX){maxX=x;}
        if(y<minY){minY=y;} if(y>maxY){maxY=y;}
      }
    }
  }
  var fit;
  if(maxX<0){ fit={s:1,cx:DESIGN/2,cy:DESIGN/2}; }
  else{
    var bw=maxX-minX+1, bh=maxY-minY+1;
    fit={ s:(DESIGN*FILL_RATIO)/Math.max(bw,bh), cx:(minX+maxX)/2, cy:(minY+maxY)/2 };
  }
  fitCache[shape.id]=fit;
  return fit;
}

/* Foreground only, auto-fitted, transparent outside the subject.
   This is both the colour source and the outline mask.               */
function renderFittedFG(shape){
  var c = document.createElement("canvas");
  c.width=DESIGN; c.height=DESIGN;
  var ctx=c.getContext("2d");
  var fit=computeFit(shape);
  ctx.save();
  ctx.translate(DESIGN/2,DESIGN/2);
  ctx.scale(fit.s,fit.s);
  ctx.translate(-fit.cx,-fit.cy);
  shape.draw(ctx);
  ctx.restore();
  return c;
}

function renderThumb(shape, canvas, framed){
  var ctx=canvas.getContext("2d");
  var fit=computeFit(shape);
  var k=canvas.width/DESIGN;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.scale(k,k);
  if(!framed){
    ctx.fillStyle=shape.palette[0];
    ctx.fillRect(0,0,DESIGN,DESIGN);
  }
  ctx.translate(DESIGN/2,DESIGN/2);
  ctx.scale(fit.s,fit.s);
  ctx.translate(-fit.cx,-fit.cy);
  shape.draw(ctx);
  ctx.restore();
}

/* =====================================================================
   5. MOSAIC BUILD
   ===================================================================== */
function hexToRgb(hex){
  var v=parseInt(hex.slice(1),16);
  return [(v>>16)&255,(v>>8)&255,v&255];
}
function nearestIndex(r,g,b,pal,from){
  var best=from,bestD=Infinity,i,p,d;
  for(i=from;i<pal.length;i++){
    p=pal[i];
    d=(r-p[0])*(r-p[0])+(g-p[1])*(g-p[1])+(b-p[2])*(b-p[2]);
    if(d<bestD){ bestD=d; best=i; }
  }
  return best;
}

var SAMPLES=[[0,0],[-0.28,-0.28],[0.28,-0.28],[-0.28,0.28],[0.28,0.28]];

function buildPuzzle(shape, cols, frameMode){
  var fg = renderFittedFG(shape);
  var data = fg.getContext("2d").getImageData(0,0,DESIGN,DESIGN).data;
  var pal = shape.palette.map(hexToRgb);
  var cell = DESIGN/cols;
  var cutToShape = (frameMode === "shape");
  var from = cutToShape ? 1 : 0;   // drop backdrop colour when cutting

  var grid=[], mask=[], row,col,i,x,y,idx,cx,cy;
  for(row=0;row<cols;row++){
    var gRow=[], mRow=[];
    for(col=0;col<cols;col++){
      cx = col*cell + cell/2;
      cy = row*cell + cell/2;

      var inside=0, pick=-1, counts={}, best=-1, bestC=-1;
      for(i=0;i<SAMPLES.length;i++){
        x=Math.round(cx+SAMPLES[i][0]*cell);
        y=Math.round(cy+SAMPLES[i][1]*cell);
        if(x<0){x=0;} if(x>DESIGN-1){x=DESIGN-1;}
        if(y<0){y=0;} if(y>DESIGN-1){y=DESIGN-1;}
        idx=(y*DESIGN+x)*4;
        if(data[idx+3]>128){
          inside++;
          pick = nearestIndex(data[idx],data[idx+1],data[idx+2],pal,from);
          counts[pick]=(counts[pick]||0)+1;
        }
      }

      var isInside = cutToShape ? (inside>=3) : true;

      if(!isInside && cutToShape){
        gRow.push(-1); mRow.push(false);
      } else if(inside===0){
        gRow.push(0); mRow.push(true);          // backdrop cell (square mode)
      } else {
        for(var k in counts){
          if(counts[k]>bestC){ bestC=counts[k]; best=parseInt(k,10); }
        }
        gRow.push(best); mRow.push(true);
      }
    }
    grid.push(gRow); mask.push(mRow);
  }

  /* renumber used colours to 1,2,3… so the key has no gaps */
  var order=[], seen={}, r2,c2,v;
  for(r2=0;r2<cols;r2++){
    for(c2=0;c2<cols;c2++){
      v=grid[r2][c2];
      if(v>=0 && !seen[v]){ seen[v]=true; order.push(v); }
    }
  }
  order.sort(function(a,b){ return a-b; });
  var numberOf={};
  for(i=0;i<order.length;i++){ numberOf[order[i]] = i+1; }

  return { grid:grid, mask:mask, order:order, numberOf:numberOf, cols:cols };
}

function drawMosaic(canvas, puzzle, palette, colored){
  var size=canvas.width, cols=puzzle.cols;
  var ctx=canvas.getContext("2d");
  ctx.fillStyle="#ffffff";
  ctx.fillRect(0,0,size,size);

  var cell=size/cols;
  var fontPx=Math.max(8,Math.round(cell*0.46));
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.font="600 "+fontPx+"px -apple-system,Arial,sans-serif";

  var row,col,x,y,idx;
  for(row=0;row<cols;row++){
    for(col=0;col<cols;col++){
      if(!puzzle.mask[row][col]){ continue; }
      idx=puzzle.grid[row][col];
      x=col*cell; y=row*cell;
      if(colored){
        ctx.fillStyle=palette[idx];
        ctx.fillRect(x,y,cell,cell);
        ctx.strokeStyle="rgba(0,0,0,0.10)";
      } else {
        ctx.strokeStyle="#9E978A";
      }
      ctx.lineWidth=1;
      ctx.strokeRect(x+0.5,y+0.5,cell-1,cell-1);
      if(!colored){
        ctx.fillStyle="#1F1D2B";
        ctx.fillText(String(puzzle.numberOf[idx]), x+cell/2, y+cell/2+fontPx*0.06);
      }
    }
  }
}

/* =====================================================================
   6. STATE + UI
   ===================================================================== */
var state = { lang:"en", shapeId:"cat", frame:"shape", diffId:"medium", puzzle:null, ready:false };

function q(id){ return document.getElementById(id); }
function T(){ return I18N[state.lang]; }
function getShape(id){
  var i;
  for(i=0;i<SHAPES.length;i++){ if(SHAPES[i].id===id){ return SHAPES[i]; } }
  return SHAPES[0];
}
function currentCols(){
  var i;
  for(i=0;i<DIFFICULTIES.length;i++){ if(DIFFICULTIES[i].id===state.diffId){ return DIFFICULTIES[i].cols; } }
  return 24;
}

function invalidate(){
  state.ready=false; state.puzzle=null;
  q("puzzleCanvas").style.display="none";
  q("emptyState").style.display="block";
  q("emptyState").textContent=T().empty;
  q("legendBox").innerHTML="";
  q("btnPng").disabled=true;
  q("btnPrint").disabled=true;
}

function applyLang(){
  var t=T();
  document.documentElement.lang=state.lang;
  document.documentElement.dir=RTL_LANGS[state.lang]?"rtl":"ltr";
  document.title=t.title+" \u2014 "+t.sub;
  q("appTitle").textContent=t.title;
  q("appSub").textContent=t.sub;
  q("lblChoose").textContent=t.choose;
  q("lblFrame").textContent=t.frame;
  q("lblDiff").textContent=t.difficulty;
  q("lblGenerate").textContent=t.generate;
  q("lblPreview").textContent=t.preview;
  q("btnGenerate").textContent=t.genBtn;
  q("genHint").textContent=t.genHint;
  q("btnPng").textContent=t.png;
  q("btnPrint").textContent=t.print;
  q("printNote").textContent=t.printNote;
  q("emptyState").textContent=t.empty;
  buildShapePicker(); buildFrameRow(); buildDiffRow();
}

function buildShapePicker(){
  var t=T(), wrap=q("shapePicker");
  wrap.innerHTML="";
  CATEGORY_ORDER.forEach(function(cat){
    var block=document.createElement("div");
    block.className="cat-block";
    var title=document.createElement("p");
    title.className="cat-title";
    title.textContent=t.categories[cat];
    block.appendChild(title);
    var grid=document.createElement("div");
    grid.className="shape-grid";
    SHAPES.filter(function(s){ return s.category===cat; }).forEach(function(shape){
      var btn=document.createElement("div");
      btn.className="shape-btn"+(shape.id===state.shapeId?" active":"");
      btn.setAttribute("role","button");
      var c=document.createElement("canvas");
      c.width=120; c.height=120;
      renderThumb(shape,c,state.frame==="shape");
      var label=document.createElement("span");
      label.textContent=t.shapes[shape.id];
      btn.appendChild(c); btn.appendChild(label);
      btn.addEventListener("click",function(){
        state.shapeId=shape.id; invalidate(); buildShapePicker();
      });
      grid.appendChild(btn);
    });
    block.appendChild(grid);
    wrap.appendChild(block);
  });
}

function buildFrameRow(){
  var t=T(), wrap=q("frameRow");
  wrap.innerHTML="";
  FRAMES.forEach(function(f){
    var btn=document.createElement("div");
    btn.className="seg-btn"+(f===state.frame?" active":"");
    btn.setAttribute("role","button");
    var main=document.createElement("strong");
    main.textContent=t.frames[f];
    var sub=document.createElement("small");
    sub.textContent=t.frameHints[f];
    btn.appendChild(main); btn.appendChild(sub);
    btn.addEventListener("click",function(){
      state.frame=f; invalidate(); buildFrameRow(); buildShapePicker();
    });
    wrap.appendChild(btn);
  });
}

function buildDiffRow(){
  var t=T(), wrap=q("diffRow");
  wrap.innerHTML="";
  DIFFICULTIES.forEach(function(d){
    var btn=document.createElement("div");
    btn.className="seg-btn"+(d.id===state.diffId?" active":"");
    btn.setAttribute("role","button");
    var main=document.createElement("strong");
    main.textContent=t.diff[d.id];
    var sub=document.createElement("small");
    sub.textContent=d.cols+"\u00D7"+d.cols;
    btn.appendChild(main); btn.appendChild(sub);
    btn.addEventListener("click",function(){
      state.diffId=d.id; invalidate(); buildDiffRow();
    });
    wrap.appendChild(btn);
  });
}

function buildLegendInto(container, shape, puzzle){
  container.innerHTML="";
  puzzle.order.forEach(function(idx){
    var item=document.createElement("div");
    item.className="legend-item";
    var sw=document.createElement("div");
    sw.className="swatch";
    sw.style.background=shape.palette[idx];
    var num=document.createElement("span");
    num.textContent=String(puzzle.numberOf[idx]);
    item.appendChild(sw); item.appendChild(num);
    container.appendChild(item);
  });
}

function generate(){
  var btn=q("btnGenerate");
  btn.disabled=true;
  btn.textContent=T().working;
  window.setTimeout(function(){
    var shape=getShape(state.shapeId);
    state.puzzle=buildPuzzle(shape,currentCols(),state.frame);
    state.ready=true;
    var canvas=q("puzzleCanvas");
    drawMosaic(canvas,state.puzzle,shape.palette,false);
    canvas.style.display="block";
    q("emptyState").style.display="none";
    buildLegendInto(q("legendBox"),shape,state.puzzle);
    q("btnPng").disabled=false;
    q("btnPrint").disabled=false;
    btn.disabled=false;
    btn.textContent=T().genBtn;
  },20);
}

/* =====================================================================
   7. EXPORT
   ===================================================================== */
var EXPORT_SIZE=1800;

function exportCanvas(colored){
  var shape=getShape(state.shapeId);
  var c=document.createElement("canvas");
  c.width=EXPORT_SIZE; c.height=EXPORT_SIZE;
  drawMosaic(c,state.puzzle,shape.palette,colored);
  return c;
}

function downloadPng(){
  if(!state.ready){ return; }
  var c=exportCanvas(false);
  var name="mosaic-"+state.shapeId+"-"+state.frame+"-"+state.diffId+".png";
  if(c.toBlob){
    c.toBlob(function(blob){
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a");
      a.href=url; a.download=name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); },4000);
    },"image/png");
  } else {
    var a2=document.createElement("a");
    a2.href=c.toDataURL("image/png"); a2.download=name;
    document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  }
}

function setImage(el,dataUrl){
  return new Promise(function(resolve){
    var done=false;
    function finish(){ if(!done){ done=true; resolve(); } }
    el.onload=finish; el.onerror=finish;
    el.src=dataUrl;
    if(el.complete && el.naturalWidth>0){ finish(); }
    setTimeout(finish,3000);
  });
}

function doPrint(){
  if(!state.ready){ return; }
  var t=T(), shape=getShape(state.shapeId);
  q("pTitle1").textContent=t.puzzlePage+" \u2014 "+t.shapes[shape.id];
  q("pTitle2").textContent=t.answerKey+" \u2014 "+t.shapes[shape.id];
  buildLegendInto(q("pLegend"),shape,state.puzzle);

  var puzzleURL=exportCanvas(false).toDataURL("image/png");
  var answerURL=exportCanvas(true).toDataURL("image/png");

  Promise.all([
    setImage(q("pImgPuzzle"),puzzleURL),
    setImage(q("pImgAnswer"),answerURL)
  ]).then(function(){
    if(window.requestAnimationFrame){
      window.requestAnimationFrame(function(){
        window.requestAnimationFrame(function(){ window.print(); });
      });
    } else {
      setTimeout(function(){ window.print(); },120);
    }
  });
}

/* =====================================================================
   8. INIT
   ===================================================================== */
document.addEventListener("DOMContentLoaded",function(){
  q("langSelect").value=state.lang;
  q("langSelect").addEventListener("change",function(e){
    state.lang=e.target.value; applyLang(); invalidate();
  });
  q("btnGenerate").addEventListener("click",generate);
  q("btnPng").addEventListener("click",downloadPng);
  q("btnPrint").addEventListener("click",doPrint);
  applyLang();
  invalidate();
});

})();
